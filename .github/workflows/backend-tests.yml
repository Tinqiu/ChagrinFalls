name: Backend Tests

on:
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore src/ChagrinFalls.Tests

      - name: Build
        run: dotnet build src/ChagrinFalls.Tests --no-restore --configuration Release

      - name: Test
        run: dotnet test src/ChagrinFalls.Tests --no-build --configuration Release --logger "console;verbosity=normal"

